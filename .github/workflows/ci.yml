name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows)
    # Windows is where this library means anything: it is the only runner with a real
    # explorer.exe taskbar to discover.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test the library
        run: ./gradlew build --stacktrace

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal --stacktrace

      # The samples are a separate Gradle build that resolves the library by coordinate. Building
      # them here is what proves a real consumer gets everything - including JNA's native stubs -
      # from the published artifact alone.
      - name: Build the samples against the published artifact
        run: ./gradlew -p samples build --stacktrace

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: '**/build/reports/tests/**'
