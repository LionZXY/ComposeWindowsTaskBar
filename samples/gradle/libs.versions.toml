[versions]
kotlin = "2.4.0"
compose = "1.11.1"
# The library is consumed exactly as a third-party dependency would be.
composeWindowsTaskbar = "0.1.0"

[libraries]
compose-windows-taskbar = { module = "uk.kulikov:compose-windows-taskbar", version.ref = "composeWindowsTaskbar" }
compose-material = { module = "org.jetbrains.compose.material:material", version.ref = "compose" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
